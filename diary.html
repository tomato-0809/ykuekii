<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>diary — ykuekii</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #EDF4F6;
    --ink: #16191C;
    --ink-soft: #55666D;
    --accent: #2E9FD1;
    --line: #CBE0E7;
    --card: #F7FBFC;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  ::selection{ background: var(--accent); color: #fff; }
  a{ color: inherit; text-decoration: none; }

  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 0 32px;
  }

  header{
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(237,244,246,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav.wrap{
    max-width: 880px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    height: 64px;
  }
  .logo{
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.02em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .logo .dot{
    width:8px; height:8px;
    background: var(--accent);
    display:inline-block;
    border-radius: 2px;
  }
  .navlinks{
    display:flex;
    gap: 28px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .navlinks a{ transition: color .2s ease; }
  .navlinks a:hover{ color: var(--ink); }
  .navlinks a.current{ color: var(--ink); }

  .pagehead{ padding: 90px 0 60px; }
  .pagehead .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 22px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .pagehead .eyebrow::before{
    content:'';
    width: 24px; height: 1px;
    background: var(--ink-soft);
  }
  .pagehead h1{
    font-weight: 700;
    font-size: clamp(38px, 7vw, 60px);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .pagehead p{
    margin-top: 22px;
    max-width: 480px;
    font-size: 15.5px;
    line-height: 1.8;
    color: var(--ink-soft);
  }

  .entries{
    padding: 20px 0 80px;
    display:flex;
    flex-direction: column;
  }
  .entry{
    display:grid;
    grid-template-columns: 100px 1fr;
    gap: 24px;
    padding: 28px 0;
    border-top: 1px solid var(--line);
  }
  .entry:first-child{ border-top: 1px solid var(--line); }
  .entry .date{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--accent);
    padding-top: 3px;
  }
  .entry .text{
    font-size: 15px;
    line-height: 1.85;
    color: var(--ink);
  }
  .entry .text strong{ font-weight: 700; }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
    transition: color .2s ease, border-color .2s ease;
  }
  .back-link::before{ content: '←'; transition: transform .2s ease; }
  .back-link:hover{ color: var(--ink); border-color: var(--ink); }
  .back-link:hover::before{ transform: translateX(-4px); }

  footer{
    padding: 40px 0 60px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  footer .wrap{ max-width: 880px; }
  footer a{ transition: color .2s ease; }
  footer a:hover{ color: var(--ink); }

  .reveal{
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .reveal.in{ opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .reveal{ opacity:1; transform:none; transition:none; }
  }

  @media (max-width: 700px){
    .navlinks{ gap: 16px; }
    .pagehead{ padding: 70px 0 40px; }
    .entry{ grid-template-columns: 1fr; gap: 6px; }
  }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a class="logo" href="index.html"><span class="dot"></span>ykuekii</a>
    <div class="navlinks">
      <a href="index.html#intro">about</a>
      <a href="about.html">profile</a>
      <a href="hobbies.html">hobbies</a>
      <a href="diary.html" class="current">diary</a>
    </div>
  </nav>
</header>

<section class="pagehead">
  <div class="wrap">
    <p class="eyebrow">Diary</p>
    <h1>日記</h1>
    <p>note に書くほどでもない、ちょっとしたことを書き溜めていく場所です。</p>
  </div>
</section>

<section class="entries">
  <div class="wrap">
    <div class="entry reveal">
      <div class="date">2026.07.28</div>
      <div class="text">日記ページを作りました。これから、ちょっとしたことをここに書いていきます。</div>
    </div>
    <a class="back-link reveal" href="index.html">トップに戻る</a>
  </div>
</section>

<footer>
  <div class="wrap" style="display:flex; justify-content:space-between; align-items:flex-start; width:100%; flex-wrap:wrap; gap:16px;">
    <span>© ykuekii</span>
    <div style="display:flex; gap:18px; flex-wrap:wrap;">
      <a href="https://scratch.mit.edu/users/ykuekii/" target="_blank" rel="noopener">Scratch</a>
      <a href="https://scratch.mit.edu/users/-sub-ykuekii-/" target="_blank" rel="noopener">Scratch (sub)</a>
      <a href="https://note.com/yukkkun" target="_blank" rel="noopener">note</a>
    </div>
  </div>
</footer>

<script>
  const items = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  items.forEach(i=>io.observe(i));
</script>

</body>
</html>
