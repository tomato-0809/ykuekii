<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>diary — ykuekii</title>
<link rel="stylesheet" href="/common.css">
<style>
  .entries{
    padding: 20px 0 80px;
    display:flex;
    flex-direction: column;
  }
  .entry{
    display:grid;
    grid-template-columns: 100px 1fr;
    gap: 24px;
    padding: 28px 0;
    border-top: 1px solid var(--line);
  }
  .entry:first-child{ border-top: 1px solid var(--line); }
  .entry .date{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--accent);
    padding-top: 3px;
  }
  .entry .text{
    font-size: 15px;
    line-height: 1.85;
    color: var(--ink);
  }
  .entry .text strong{ font-weight: 700; }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
    transition: color .2s ease, border-color .2s ease;
  }
  .back-link::before{ content: '←'; transition: transform .2s ease; }
  .back-link:hover{ color: var(--ink); border-color: var(--ink); }
  .back-link:hover::before{ transform: translateX(-4px); }

  @media (max-width: 700px){
    .entry{ grid-template-columns: 1fr; gap: 6px; }
  }
</style>
</head>
<body data-page="diary">

  <nav class="wrap">
    <a class="logo" href="index.html"><span class="dot"></span>ykuekii</a>
    <div class="navlinks">

      <a href="about.html">profile</a>
      <a href="hobbies.html">hobbies</a>
      <a href="diary.html" class="current">diary</a>
    </div>
  </nav>
</header>

<section class="hero">
  <div class="wrap">
    <p class="eyebrow">Diary</p>
    <h1>日記</h1>
    <p>日々感じた、ちょっとしたことを書き溜めていく場所です。</p>
  </div>
</section>

<section class="entries">
  <div class="wrap">
    <div class="entry reveal">
      <div class="date">2026.07.28</div>
      <div class="text">日記ページを作りました。これから、ちょっとしたことをここに書いていきます。</div>
    </div>
    <a class="back-link reveal" href="index.html">トップに戻る</a>
  </div>
</section>
